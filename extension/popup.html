<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Battery Ring</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      width: 236px;
      background: #0b0c10;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #f2f2f7;
    }
    .card {
      margin: 8px;
      padding: 16px 14px 12px;
      border-radius: 16px;
      background: linear-gradient(180deg, #1e1f26 0%, #14151b 100%);
      box-shadow: 0 8px 22px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.055);
      display: flex; flex-direction: column; align-items: center;
    }
    .ringbox { position: relative; width: 150px; height: 150px; }
    svg.ring { width: 150px; height: 150px; display: block; }
    .track { stroke: rgba(255,255,255,0.10); }
    .prog {
      stroke: #22c55e;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 100px 100px;
      transition: stroke-dashoffset .55s cubic-bezier(.16,1,.3,1), stroke .3s;
    }
    .center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; pointer-events: none;
    }
    .bt path { fill: none; stroke: #e7e7ee; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .num { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: .3px; }
    .num .sign { font-size: 14px; margin-left: 1px; opacity: .85; }
    .model {
      font-size: 13.5px; font-weight: 700; text-align: center; margin-top: 10px;
      max-width: 200px; line-height: 1.35; word-break: break-word;
      color: #f0f0f5;
    }
    .status { font-size: 11.5px; color: rgba(235,235,245,.5); text-align: center; margin-top: 3px; min-height: 15px; }
    .footer { display: flex; justify-content: center; margin-top: 11px; }
    button {
      border: none; border-radius: 8px; padding: 6px 16px; font-size: 12px;
      font-weight: 600; cursor: pointer; color: #fff;
      background: rgba(255,255,255,.10);
    }
    button:hover { background: rgba(255,255,255,.16); }
    button:active { transform: scale(.96); }
  </style>
</head>
<body>
  <div class="card">
    <div class="ringbox">
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="80" fill="none" stroke-width="12"/>
        <circle id="prog" class="prog" cx="100" cy="100" r="80" fill="none" stroke-width="12"
                stroke-dasharray="502.65" stroke-dashoffset="502.65"/>
      </svg>
      <div class="center">
        <div class="num"><span id="num">--</span><span class="sign">%</span></div>
      </div>
    </div>
    <div class="model" id="model"></div>
    <div class="status" id="status"></div>
    <div class="footer"><button id="refresh"></button></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
